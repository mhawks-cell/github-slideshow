<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="{{ page.description | default: site.description }}" />
  <title>{{ page.title | default: site.title }}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}" />
</head>
<body>

  <header class="site-header">
    <div class="container header-inner">
      <a class="logo" href="{{ '/' | relative_url }}">
        <span class="logo-mark">&#9670;</span>
        <span class="logo-text">{{ site.practice_name | default: "PM Consulting" }}</span>
      </a>
      <button class="nav-toggle" aria-label="Open menu" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>
      <nav class="site-nav" aria-label="Main navigation">
        <a href="{{ '/#services' | relative_url }}">Services</a>
        <a href="{{ '/#about' | relative_url }}">About</a>
        <a href="{{ '/#testimonials' | relative_url }}">Testimonials</a>
        <a href="{{ '/blog/' | relative_url }}">Blog</a>
        <a href="{{ '/#contact' | relative_url }}" class="nav-cta">Contact</a>
      </nav>
    </div>
  </header>

  <main>
    {{ content }}
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>&copy; {{ 'now' | date: "%Y" }} {{ site.practice_name | default: "PM Consulting" }}. All rights reserved.</p>
      <p class="footer-tagline">Delivering results through expert project leadership.</p>
    </div>
  </footer>

  <script src="{{ '/assets/js/main.js' | relative_url }}"></script>
</body>
</html>
